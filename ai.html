<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Nail Design | Dream Nails Studio</title>

  <link rel="stylesheet" href="/src/ai/ai.css">
</head>

<body>

  <!-- HEADER -->
  <header class="ai-header">
    <img src="/images/naillogo.jpeg" alt="Dream Nails Studio Logo">
    <h1>AI Nail Design Suggestion</h1>
    <p>Upload your hand photo and discover your perfect nail style 💅</p>
  </header>

  <!-- MAIN CONTENT -->
  <main class="ai-container">

    <!-- UPLOAD CARD -->
    <section class="upload-card">

      <h2>✨ Find Your Perfect Nail Design</h2>

      <label for="handPhoto" class="upload-box">
        <span id="uploadText">📷 Click to upload your hand photo</span>
        <input
          type="file"
          id="handPhoto"
          accept="image/*"
        >
      </label>

      <!-- HAND PHOTO PREVIEW -->
      <div id="previewContainer" class="preview-container">
        <img id="previewImage" alt="Hand photo preview">
      </div>

      <!-- STYLE SELECTION -->
      <label for="style">Choose your preferred style:</label>

      <select id="style">
        <option value="any">Any Style</option>
        <option value="simple">Simple &amp; Elegant</option>
        <option value="glitter">Glitter</option>
        <option value="french">French Tips</option>
        <option value="chrome">Chrome</option>
        <option value="bridal">Bridal</option>
        <option value="floral">Floral</option>
      </select>

      <!-- SUGGEST BUTTON -->
      <button id="suggestBtn" type="button">
        🤖 Suggest Nail Design
      </button>

    </section>

    <!-- DESIGN RESULTS: OUTSIDE UPLOAD CARD -->
    <section id="result" class="result" aria-live="polite"></section>

  </main>

  <!-- AI JAVASCRIPT -->
  <script type="module" src="/src/ai/ai.js"></script>

</body>
</html>
