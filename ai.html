<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Nail Design | Dream Nails Studio</title>
  <link rel="stylesheet" href="/src/ai/ai.css">
</head>

<body>

  <header class="ai-header">
    <img src="/images/naillogo.jpeg" alt="Dream Nails Studio Logo">
    <h1>AI Nail Design Suggestion</h1>
    <p>Upload your hand photo and discover a nail style suggestion 💅</p>
  </header>

  <main class="ai-container">

    <section class="upload-card">

      <h2>✨ Find Your Perfect Nail Design</h2>

      <label for="handPhoto" class="upload-box">
        <span id="uploadText">📷 Click to upload your hand photo</span>
        <input type="file" id="handPhoto" accept="image/*">
      </label>

      <div id="previewContainer" class="preview-container">
        <img id="previewImage" alt="Hand preview">
      </div>

      <label for="style">Choose your preferred style:</label>

      <select id="style">
        <option value="Any">Any Style</option>
        <option value="Simple">Simple & Elegant</option>
        <option value="Glitter">Glitter</option>
        <option value="French">French Tips</option>
        <option value="Chrome">Chrome</option>
        <option value="Bridal">Bridal</option>
        <option value="Floral">Floral</option>
      </select>

      <button id="suggestBtn">
        🤖 Suggest Nail Design
      </button>

      <div id="result" class="result"></div>

    </section>

  </main>

  <script type="module" src="/src/ai/ai.js"></script>

</body>
</html>
